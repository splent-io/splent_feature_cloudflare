[build-system]
requires = ["setuptools>=80.3.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splent_feature_cloudflare"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [

]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.tests", "*.tests.*"]

[tool.splent]
cli_version = "1.11.0"

[tool.splent.contract]
description = "cloudflare feature"

[tool.splent.contract.provides]
routes = []
blueprints = []
models = []
commands = []

[tool.splent.contract.requires]
features = []
env_vars = []

[tool.splent.contract.extensible]
services = []
templates = []
models = []
hooks = []
routes = false
